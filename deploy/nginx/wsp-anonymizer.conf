# /etc/nginx/conf.d/wsp-anonymizer.conf
# Доступ только с клиентским сертификатом, выпущенным нашим УЦ (mTLS).

server {
    listen 80;
    server_name anon.wsp.local;
    return 301 https://$host$request_uri;
}

server {
    # Для nginx >= 1.25 можно заменить на: listen 443 ssl; http2 on;
    listen 443 ssl http2;
    server_name anon.wsp.local;

    # Серверный сертификат (лучше от корпоративного AD CS, чтобы браузеры доверяли без предупреждений)
    ssl_certificate     /etc/wsp-anonymizer/tls/server.crt;
    ssl_certificate_key /etc/wsp-anonymizer/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:anon:10m;
    ssl_session_tickets off;

    # --- mTLS ---
    ssl_client_certificate /etc/wsp-anonymizer/pki/ca.crt;   # УЦ, которым подписаны клиентские сертификаты
    ssl_crl                /etc/wsp-anonymizer/pki/crl.pem;  # список отзыва (обновляется revoke-client.sh)
    ssl_verify_client on;
    ssl_verify_depth 2;

    error_page 495 496 = @nocert;
    location @nocert {
        default_type "text/html; charset=utf-8";
        return 403 '<h2>Доступ запрещён</h2><p>Нужен действительный клиентский сертификат WSP. Обратитесь в ИТ-отдел.</p>';
    }

    client_max_body_size 55m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    access_log /var/log/nginx/anonymizer.access.log;
    error_log  /var/log/nginx/anonymizer.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Результат проверки сертификата — приложение доверяет этим заголовкам,
        # т.к. слушает только 127.0.0.1. nginx всегда перезаписывает их, подделать снаружи нельзя.
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-S-DN   $ssl_client_s_dn;
        proxy_set_header X-SSL-Client-Serial $ssl_client_serial;
        proxy_read_timeout 300s;
        proxy_request_buffering on;
    }
}
